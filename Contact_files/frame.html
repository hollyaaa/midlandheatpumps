<body>

  <div class="form-container">

    <h1>Contact Form</h1>

    <form id="contactForm">

      <label>First Name</label>
      <input
        type="text"
        id="firstname"
        placeholder="Enter your name"
        required
      >
       <label>Last Name</label>
      <input
        type="text"
        id="lastname"
        placeholder="Enter your name"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <button type="submit">
        Submit
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- Supabase JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

const SUPABASE_URL = "https://ltgxnrztexdhhfypgfqo.supabase.co";
const SUPABASE_KEY = "sb_publishable_SKdMiG7oAWxtXLdsPetkfQ_pIh1Gi82";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// Define this BEFORE the submit handler
const sendEmail = async (email, subject, text) => {
  try {
    const response = await fetch(
      'https://ltgxnrztexdhhfypgfqo.supabase.co/functions/v1/bright-action',
      {
        method: "POST",
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer sb_publishable_SKdMiG7oAWxtXLdsPetkfQ_pIh1Gi82', // Use the stored token
         'apikey' :'sb_publishable_SKdMiG7oAWxtXLdsPetkfQ_pIh1Gi82',
         
        },
        body: JSON.stringify({
          to: email,
          subject: subject,
          text: text
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      alert("Email error:", result);
      alert(result.error || "Failed to send email");
    }

    return result;

  } catch (error) {
    alert("Error sending email:", error);
   
  }
};


// Handle form submission
document
  .getElementById("contactForm")
  .addEventListener("submit", async function (event) {

    event.preventDefault();
  const name = document.getElementById("firstname").value;
    const firstname = document.getElementById("firstname").value;
        const lastname = document.getElementById("lastname").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message");

    message.textContent = "Saving...";

    // Save contact
    const { error } = await supabaseClient
      .from("contacts")
      .insert([
        {
          name: firstname,
          firstname: firstname,
          lastname:lastname,
          email: email
        }
      ]);

    if (error) {
      console.error(error);

      message.textContent = "Error: " + error.message;
      message.style.color = "red";

      return;
    }

    // Send email AFTER successful database insert
    try {
      await sendEmail(
        email,
        "New contact form submission",
        `Name: $firstname}\nEmail: ${email}`
      );

      message.textContent =
        "Email and form submitted successfully!";

      message.style.color = "green";

      document.getElementById("contactForm").reset();

    } catch (error) {

      message.textContent =
        "Form saved, but email could not be sent.";

      message.style.color = "orange";

      console.error(error);
    }
  });
   
  </script>
