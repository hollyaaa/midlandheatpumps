<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hWALEwIH" crossorigin="anonymous">
  </head>
  <body>
    
    <div id="app" class="container mt-3 bd-layout">
    <h1 class="text-center">Groceries</h1>
     <section id="login">
       <div class="row justify-content-md-center">
         <div class="col-md-4 card">
           <div class="card-body">
              <h2 class="card-title">Sign Up / Login</h2>
              <form>

               <div class="mb-3">
                 <input type="email" class="form-control" id="email" placeholder="Email" required />
               </div>
                <div class="mb-3">
                  <input type="password" class="form-control" id="password" placeholder="Password" required />
                </div>
                <button id="signup-btn" class="btn btn-primary">Sign Up</button>
               <button id="login-btn" class="btn btn-primary">Login</button>
              </form">
            </div>
         </div>
        </div>
     </section>
            <section id="list" class="d-none">
        <div class="row justify-content-md-center m-2">
          <div class="col-md-8 p-2 card">
            <div class="card-body">
              <h2 class="card-title">List</h2>
              <div class="input-group">
                <span class="input-group-text">Item</span>
                <input type="text" class="form-control" id="item-input" placeholder="E.g. Apple" />
                <button id="add-item-btn" class="btn btn-outline-success">Add</button>
              </div>
            </div>
            <div class="row gx-2">
            <div class="col">
              <div class="card h-100">
                <div class="card-body">
                  <h2 class="card-title">Past Items</h2>
                  <ul class="list-group" id="past-items-list">
                    <li class="list-group-item">An item</li>
                    <li class="list-group-item">A second item</li>
                    <li class="list-group-item">A third item</li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <div class="card-body">
                  <h2 class="card-title">Need to buy</h2>
                  <ul class="list-group" id="groceries-list">
                    <li class="list-group-item">An item</li>
                    <li class="list-group-item">A second item</li>
                    <li class="list-group-item">A third item</li>
                    <li class="list-group-item">A fourth item</li>
                    <li class="list-group-item">And a fifth one</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

           <section id="controls" class="d-none">
        <div class="row justify-content-md-center mt-3">
         <div class="col-md-4 card">
            <div class="card-body">
              <h3 class="card-title">Controls</h3>
             <button id="logout-btn" class="btn btn-outline-primary">Logout</button>
            </div>
          </div>
       </div>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./main.js"></script
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
