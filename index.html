<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3ecf8e;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #2fb978;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <h1>Contact Form</h1>

    <form id="contactForm">

      <label>Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <button type="submit">
        Submit
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- Supabase JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // Replace these with your Supabase project details
    const SUPABASE_URL = "https://ltgxnrztexdhhfypgfqo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SKdMiG7oAWxtXLdsPetkfQ_pIh1Gi82";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // Handle form submission
    document
      .getElementById("contactForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        const message = document.getElementById("message");

        message.textContent = "Saving...";


        // Insert data into Supabase
        const { data, error } = await supabaseClient
          .from("contacts")
          .insert([
            {
              name: name,
              email: email
            }
          ]);


        if (error) {

          console.error(error);

          message.textContent =
            "Error: " + error.message;

          message.style.color = "red";

          return;
        }


        // Success
        message.textContent =
          "Form submitted successfully!";

        message.style.color = "green";

        document.getElementById("contactForm").reset();

      });

  </script>

</body>
</html>
